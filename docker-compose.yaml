version: "3.9"

services:
  gor_postgres:
    image: postgres:17.4-alpine
    container_name: gor_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - gor_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.5" # Max 50% of 1 CPU core
          memory: 350M # Cap RAM at 350 MB

  gor_redis:
    image: redis:7.4.0-alpine
    container_name: gor_redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - gor_session:/data
    deploy:
      resources:
        limits:
          cpus: "0.3" # Max 30% of 1 CPU core
          memory: 150M # Cap RAM at 150 MB

volumes:
  gor_data:
  gor_session:
