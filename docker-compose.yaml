services:
  gor_postgres:
    image: postgres:17.4-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - gor_data:/var/lib/postgresql/data

  gor_redis:
    image: redis:7.4.0
    container_name: gor_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - gor_session:/data

volumes:
  gor_data:
  gor_session:
